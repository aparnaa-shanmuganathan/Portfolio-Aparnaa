<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Billing System: a Tkinter billing window with item list and total, connected to a MySQL database">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a2340"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#a5b4fc" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#e8ecf5"><text x="80" y="120" font-size="54" font-weight="800">Billing System</text><text x="80" y="170" font-size="28" fill="#a6b0c5">Desktop billing with MySQL storage</text><rect x="140" y="230" width="900" height="570" rx="16" fill="#121a2e" stroke="#a5b4fc" stroke-width="3"/><rect x="140" y="230" width="900" height="56" rx="16" fill="#262f5c"/><circle cx="176" cy="258" r="9" fill="#ef4444"/><circle cx="206" cy="258" r="9" fill="#fbbf24"/><circle cx="236" cy="258" r="9" fill="#34d399"/><text x="590" y="268" font-size="24" text-anchor="middle">Billing System</text><text x="180" y="340" font-size="24" fill="#a6b0c5">Item</text><text x="640" y="340" font-size="24" fill="#a6b0c5">Qty</text><text x="820" y="340" font-size="24" fill="#a6b0c5">Price</text><line x1="170" y1="356" x2="1010" y2="356" stroke="#263049" stroke-width="2"/><text x="180" y="405" font-size="26">Notebook</text><text x="650" y="405" font-size="26">3</text><text x="820" y="405" font-size="26">₹ 180</text><text x="180" y="465" font-size="26">Pen set</text><text x="650" y="465" font-size="26">2</text><text x="820" y="465" font-size="26">₹ 90</text><text x="180" y="525" font-size="26">Marker</text><text x="650" y="525" font-size="26">5</text><text x="820" y="525" font-size="26">₹ 250</text><text x="180" y="585" font-size="26">Stapler</text><text x="650" y="585" font-size="26">1</text><text x="820" y="585" font-size="26">₹ 120</text><line x1="170" y1="640" x2="1010" y2="640" stroke="#263049" stroke-width="2"/><text x="820" y="700" font-size="32" font-weight="800" fill="#a5b4fc">₹ 640</text><rect x="180" y="720" width="190" height="52" rx="12" fill="url(#ac)"/><text x="275" y="755" font-size="24" font-weight="700" fill="#0b1020" text-anchor="middle">Print Bill</text><g transform="translate(1180 320)"><ellipse cx="130" cy="30" rx="130" ry="36" fill="#262f5c" stroke="#a5b4fc" stroke-width="3"/><path d="M0 30v190c