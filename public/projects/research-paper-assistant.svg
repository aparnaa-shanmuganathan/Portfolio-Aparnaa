<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#a5b4fc" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#e8ecf5"><text x="80" y="120" font-size="54" font-weight="800">AI Research Paper Assistant</text><text x="80" y="170" font-size="28" fill="#a6b0c5">Ask questions, get answers grounded in your PDFs</text><rect x="90" y="300" width="190" height="250" rx="12" fill="#121a2e" stroke="#263049" stroke-width="3"/><rect x="130" y="340" width="190" height="250" rx="12" fill="#121a2e" stroke="#263049" stroke-width="3"/><rect x="170" y="380" width="190" height="250" rx="12" fill="#121a2e" stroke="#263049" stroke-width="3"/><rect x="194" y="420" width="100" height="10" rx="5" fill="#a5b4fc" fill-opacity=".45"/><rect x="194" y="450" width="142" height="10" rx="5" fill="#a5b4fc" fill-opacity=".45"/><rect x="194" y="480" width="142" height="10" rx="5" fill="#a5b4fc" fill-opacity=".45"/><rect x="194" y="510" width="100" height="10" rx="5" fill="#a5b4fc" fill-opacity=".45"/><rect x="194" y="540" width="142" height="10" rx="5" fill="#a5b4fc" fill-opacity=".45"/><rect x="194" y="570" width="142" height="10" rx="5" fill="#a5b4fc" fill-opacity=".45"/><text x="265" y="408" font-size="22" font-weight="700" text-anchor="middle" fill="#a5b4fc">PDF</text><path d="M400 455H506" stroke="#a5b4fc" stroke-width="4"/><path d="M504 445L520 455L504 465Z" fill="#a5b4fc"/><rect x="520" y="375" width="230" height="160" rx="18" fill="#262f5c" stroke="#a5b4fc" stroke-width="3"/><text x="635.0" y="449.0" font-size="34" font-weight="700" text-anchor="middle">FAISS</text><text x="635.0" y="489.0" font-size="24" fill="#a6b0c5" text-anchor="middle">vector index</text><path d="M750 455H846" stroke="#a5b4fc" stroke-width="4"/><path d="M844 445L860 455L844 465Z" fill="#a5b4fc"/><rect x="860" y="375" width="210" height="160" rx="18" fill="#121a2e" stroke="#263049" stroke-width="3"/><text x="965.0" y="449.0" font-size="34" font-weight="700" text-anchor="middle">Gemini</text><text x="965.0" y="489.0" font-size="24" fill="#a6b0c5" text-anchor="middle">LLM</text><path d="M1070 455H1156" stroke="#a5b4fc" stroke-width="4"/><path d="M1154 445L1170 455L1154 465Z" fill="#a5b4fc"/><rect x="1170" y="290" width="360" height="330" rx="20" fill="#121a2e" stroke="#a5b4fc" stroke-width="3"/><rect x="1196" y="322" width="250" height="50" rx="14" fill="#262f5c"/><text x="1216" y="357" font-size="22">What is the main finding?</text><rect x="1196" y="392" width="310" height="200" rx="14" fill="#1a2340"/><rect x="1216" y="416" width="270" height="12" rx="6" fill="#e8ecf5" fill-opacity=".75"/><rect x="1216" y="450" width="270" height="12" rx="6" fill="#e8ecf5" fill-opacity=".75"/><rect x="1216" y="484" width="270" height="12" rx="6" fill="#e8ecf5" fill-opacity=".75"/><rect x="1216" y="518" width="170" height="12" rx="6" fill="#e8ecf5" fill-opacity=".75"/><text x="1216" y="568" font-size="20" fill="#a5b4fc">Source: paper.pdf, p. 4</text></g></svg>